<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B1E22">
<title>Cidade Sports — Uniformes</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --grafite-900:#1B1E22;
  --grafite-800:#23272C;
  --grafite-700:#2E333A;
  --grafite-600:#3B4149;
  --linha:#454C55;
  --texto:#EEF1F4;
  --texto-fraco:#9AA3AE;
  --vermelho:#D9202C;
  --vermelho-claro:#F0353F;
  --verde:#38A169;
  --ambar:#E0A426;
  --raio:10px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--grafite-900);
  color:var(--texto);
  font-family:'Inter',system-ui,sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:
    repeating-linear-gradient(118deg, transparent 0 44px, rgba(255,255,255,.018) 44px 58px, transparent 58px 96px),
    radial-gradient(1000px 520px at 78% -12%, rgba(217,32,44,.16), transparent 62%);
}
#app{position:relative;z-index:1}

h1,h2,h3,.display{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:700;letter-spacing:.2px;line-height:1.1}
h1{font-size:30px}
h2{font-size:23px}
h3{font-size:18px}
a{color:var(--vermelho-claro)}
small{font-size:12.5px;color:var(--texto-fraco)}

/* ------------------------------ layout ------------------------------ */
.topo{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:12px 20px;
  background:rgba(27,30,34,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--linha);
}
.marca{display:flex;align-items:baseline;gap:8px;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700}
.marca span{font-size:11px;letter-spacing:3.5px;color:var(--texto-fraco);font-family:'Inter',sans-serif;font-weight:600}
.topo .espaco{flex:1}
.quem{text-align:right;line-height:1.25}
.quem b{display:block;font-size:14px}
.quem small{font-size:11.5px}

main{max-width:1080px;margin:0 auto;padding:26px 20px 90px}
.centro{max-width:460px;margin:0 auto}
.grade{display:grid;gap:18px}
.grade.duas{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}

/* ------------------------------ cartões ------------------------------ */
.cartao{
  background:var(--grafite-800);
  border:1px solid var(--linha);
  border-radius:var(--raio);
  padding:22px;
}
.cartao.destaque{border-left:4px solid var(--vermelho)}
.cartao h2,.cartao h3{margin-bottom:4px}
.cartao > p.sub{color:var(--texto-fraco);margin-bottom:18px;font-size:14px}

.suporte{
  background:linear-gradient(180deg,var(--grafite-800),var(--grafite-700));
  border:1px solid var(--linha);border-left:4px solid var(--vermelho);
  border-radius:var(--raio);padding:16px 18px;margin-top:26px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
}
.suporte div{flex:1;min-width:200px}
.suporte b{display:block;font-size:15px}
.suporte p{color:var(--texto-fraco);font-size:13.5px}

/* ---------------------------- formulários ---------------------------- */
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--texto)}
.campo{margin-bottom:16px}
input,select,textarea{
  width:100%;padding:11px 13px;
  background:var(--grafite-700);color:var(--texto);
  border:1px solid var(--linha);border-radius:8px;
  font-family:inherit;font-size:15px;
}
input:focus,select:focus,textarea:focus,button:focus-visible{
  outline:2px solid var(--vermelho-claro);outline-offset:1px;border-color:transparent
}
input::placeholder{color:#6E7883}
textarea{resize:vertical;min-height:80px}
input[type=number]{max-width:96px}
input[type=file]{padding:9px;background:var(--grafite-700)}

button{
  font-family:'Inter',sans-serif;font-size:14.5px;font-weight:600;
  padding:11px 20px;border-radius:8px;border:1px solid transparent;
  background:var(--vermelho);color:#fff;cursor:pointer;transition:background .15s ease;
}
button:hover{background:var(--vermelho-claro)}
button.secundario{background:transparent;border-color:var(--linha);color:var(--texto)}
button.secundario:hover{background:var(--grafite-700)}
button.texto{background:none;border:none;color:var(--texto-fraco);padding:6px 4px;text-decoration:underline}
button.texto:hover{color:var(--texto);background:none}
button.pequeno{padding:7px 13px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
.acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acoes.fim{justify-content:flex-end}

/* ------------------------------ avisos ------------------------------ */
.aviso{border-radius:8px;padding:11px 14px;font-size:14px;margin-bottom:16px;border:1px solid}
.aviso.erro{background:rgba(217,32,44,.12);border-color:rgba(217,32,44,.5)}
.aviso.ok{background:rgba(56,161,105,.12);border-color:rgba(56,161,105,.5)}
.aviso.atencao{background:rgba(224,164,38,.12);border-color:rgba(224,164,38,.5)}

.selo{
  display:inline-block;padding:4px 10px;border-radius:99px;
  font-size:11.5px;font-weight:600;border:1px solid;white-space:nowrap;
}
.selo.cinza{color:var(--texto-fraco);border-color:var(--linha);background:var(--grafite-700)}
.selo.ambar{color:#F0C06A;border-color:rgba(224,164,38,.5);background:rgba(224,164,38,.12)}
.selo.vermelho{color:#FF8F97;border-color:rgba(217,32,44,.5);background:rgba(217,32,44,.12)}
.selo.verde{color:#79D3A3;border-color:rgba(56,161,105,.5);background:rgba(56,161,105,.14)}
.selo.azul{color:#8FC4F5;border-color:rgba(66,153,225,.5);background:rgba(66,153,225,.12)}

/* ------------------------------ etapas ------------------------------ */
.etapas{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.etapas div{
  flex:1;min-width:110px;padding:9px 12px;border-radius:8px;font-size:13px;
  background:var(--grafite-800);border:1px solid var(--linha);color:var(--texto-fraco);
}
.etapas div b{font-family:'Barlow Condensed',sans-serif;font-size:16px;margin-right:7px;color:var(--linha)}
.etapas div.ativa{border-color:var(--vermelho);color:var(--texto);background:var(--grafite-700)}
.etapas div.ativa b{color:var(--vermelho-claro)}
.etapas div.feita b{color:var(--verde)}

/* ------------------------------- 3D -------------------------------- */
.palco{
  position:relative;background:linear-gradient(180deg,#31363D,#1E2126);
  border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;
  height:420px;touch-action:none;cursor:grab;
}
.palco.arrastando{cursor:grabbing}
.palco canvas{display:block;width:100%;height:100%}
.palco .dica{
  position:absolute;left:14px;bottom:12px;font-size:12px;color:#C3C9D1;
  background:rgba(0,0,0,.42);padding:5px 10px;border-radius:99px;pointer-events:none;
}
.palco .vistas{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.palco .vistas button{padding:6px 11px;font-size:12px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.18)}
.palco .vistas button:hover{background:rgba(217,32,44,.75)}

/* ------------------------------ itens ------------------------------ */
.item{
  border:1px solid var(--linha);border-radius:9px;padding:15px;
  background:var(--grafite-700);margin-bottom:12px;
}
.item .linha{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.item .linha > div{flex:1;min-width:132px;margin:0}
.item .topo-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.item .topo-item b{font-family:'Barlow Condensed',sans-serif;font-size:17px}

.opcoes{display:flex;gap:8px;flex-wrap:wrap}
.opcoes button{
  background:var(--grafite-800);border:1px solid var(--linha);color:var(--texto);
  font-weight:500;padding:9px 15px;
}
.opcoes button.marcada{border-color:var(--vermelho);background:rgba(217,32,44,.16);font-weight:600}

.total{
  display:flex;justify-content:space-between;align-items:baseline;
  border-top:1px solid var(--linha);margin-top:16px;padding-top:14px;
}
.total b{font-family:'Barlow Condensed',sans-serif;font-size:29px}

/* ------------------------------- pix -------------------------------- */
.pix{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.pix .qr{background:#fff;padding:12px;border-radius:9px;line-height:0}
.pix .qr img{width:190px;height:190px;display:block}
.pix .lado{flex:1;min-width:230px}
.chave{
  display:block;background:var(--grafite-700);border:1px dashed var(--linha);
  border-radius:8px;padding:12px;font-size:14px;word-break:break-all;margin:8px 0 14px;
}

/* ------------------------------ pedidos ------------------------------ */
.pedido{border:1px solid var(--linha);border-radius:var(--raio);background:var(--grafite-800);margin-bottom:14px;overflow:hidden}
.pedido .cab{display:flex;gap:12px;align-items:center;padding:15px 18px;flex-wrap:wrap}
.pedido .cab .id{font-family:'Barlow Condensed',sans-serif;font-size:18px}
.pedido .cab .espaco{flex:1}
.pedido .corpo{padding:0 18px 18px;border-top:1px solid var(--linha);padding-top:14px}
.pedido ul{list-style:none;font-size:14px}
.pedido ul li{padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.07);display:flex;justify-content:space-between;gap:10px}
.linha-tempo{margin-top:14px;font-size:12.5px;color:var(--texto-fraco)}
.linha-tempo div{padding:3px 0 3px 14px;border-left:2px solid var(--linha)}

.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filtros button{background:var(--grafite-800);border:1px solid var(--linha);color:var(--texto-fraco);font-weight:500;padding:8px 14px;font-size:13.5px}
.filtros button.marcada{border-color:var(--vermelho);color:var(--texto);background:rgba(217,32,44,.14)}

.tabela{width:100%;border-collapse:collapse;font-size:14px}
.tabela th,.tabela td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--linha)}
.tabela th{font-size:12px;color:var(--texto-fraco);font-weight:600}
.tabela tr:last-child td{border-bottom:none}
.rolagem{overflow-x:auto}

.abas{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin-bottom:22px}
.abas button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;color:var(--texto-fraco);padding:11px 16px}
.abas button:hover{background:none;color:var(--texto)}
.abas button.marcada{color:var(--texto);border-bottom-color:var(--vermelho)}

.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.numeros div{background:var(--grafite-800);border:1px solid var(--linha);border-radius:9px;padding:14px}
.numeros b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:28px;line-height:1}
.numeros span{font-size:12.5px;color:var(--texto-fraco)}

/* ------------------------------ modal ------------------------------- */
.cortina{
  position:fixed;inset:0;background:rgba(10,12,14,.72);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{background:var(--grafite-800);border:1px solid var(--linha);border-radius:var(--raio);padding:24px;max-width:440px;width:100%}

.carregando{text-align:center;padding:60px 20px;color:var(--texto-fraco)}

@media (max-width:640px){
  main{padding:18px 14px 70px}
  .palco{height:340px}
  .topo{padding:10px 14px}
  h1{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="app"><div class="carregando">Carregando o sistema…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   Uniforme Cidade Sports em 3D.
   A camisa, o calção e o meião são cascas paramétricas: cada altura tem
   sua própria largura e profundidade, interpoladas por Catmull-Rom, com
   seção transversal em superelipse — o que dá ombro, peito, cintura e
   panturrilha em vez de cilindros. Texturas desenhadas em canvas.
   ===================================================================== */
const Uniforme3D = (function () {

  const VERMELHO = '#D6202B';
  const VERMELHO_ESC = '#9E141C';
  const CINZA_TOPO = '#5A6068';
  const CINZA = '#474D55';
  const CINZA_FUNDO = '#31353B';

  let cena, camera, renderer, kit, palco, animando = false;
  let alvoY = -0.28, alvoX = 0.04, girY = -0.28, girX = 0.04;
  let distancia = 6.2, alvoDist = 6.2;

  /* ======================= interpolação de perfil ======================= */

  function catmull(p0, p1, p2, p3, t) {
    const t2 = t * t, t3 = t2 * t;
    return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
  }

  function amostrar(chaves, t) {
    const n = chaves.length - 1;
    const f = Math.min(t, 0.999999) * n;
    const i = Math.floor(f);
    const local = f - i;
    const c = function (k) { return chaves[Math.max(0, Math.min(n, k))]; };
    return {
      y: catmull(c(i - 1).y, c(i).y, c(i + 1).y, c(i + 2).y, local),
      rx: catmull(c(i - 1).rx, c(i).rx, c(i + 1).rx, c(i + 2).rx, local),
      rz: catmull(c(i - 1).rz, c(i).rz, c(i + 1).rz, c(i + 2).rz, local)
    };
  }

  /* Seção em superelipse: expoente 2 vira círculo, acima disso encorpa. */
  function contorno(angulo, rx, rz, expoente) {
    const s = Math.sin(angulo), c = Math.cos(angulo);
    const p = 2 / expoente;
    return {
      x: Math.sign(s) * Math.pow(Math.abs(s), p) * rx,
      z: Math.sign(c) * Math.pow(Math.abs(c), p) * rz
    };
  }

  /**
   * Casca fechada por cima e por baixo conforme o perfil.
   * A emenda da textura cai na lateral do corpo, onde fica o recorte
   * vermelho: u=0 lado esquerdo, 0,25 frente, 0,5 lado direito, 0,75 costas.
   */
  function casca(chaves, material, opcoes) {
    opcoes = opcoes || {};
    const aneis = opcoes.aneis || 90;
    const voltas = opcoes.voltas || 96;
    const expoente = opcoes.expoente || 2.3;
    const curvaZ = opcoes.curvaZ || function () { return 0; };

    const posicoes = [], uvs = [], indices = [];
    for (let i = 0; i <= aneis; i++) {
      const t = i / aneis;
      const s = amostrar(chaves, t);
      const desloc = curvaZ(t);
      for (let j = 0; j <= voltas; j++) {
        const u = j / voltas;
        const ang = -Math.PI / 2 + u * Math.PI * 2;
        const p = contorno(ang, s.rx, s.rz, expoente);
        posicoes.push(p.x, s.y, p.z + desloc);
        uvs.push(u, t);
      }
    }
    for (let i = 0; i < aneis; i++) {
      for (let j = 0; j < voltas; j++) {
        const a = i * (voltas + 1) + j;
        const b = a + voltas + 1;
        indices.push(a, b, a + 1, b, b + 1, a + 1);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(posicoes, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(indices);
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, material);
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }

  /* ============================= texturas ============================= */

  function tela(l, a) {
    const c = document.createElement('canvas');
    c.width = l; c.height = a;
    return { c: c, ctx: c.getContext('2d') };
  }

  function finalizar(canvas, repetir) {
    const t = new THREE.CanvasTexture(canvas);
    t.anisotropy = 16;
    t.encoding = THREE.sRGBEncoding;
    if (repetir) { t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping; }
    return t;
  }

  /* Trama diagonal de pinceladas, como na estampa da referência. */
  function tramaDiagonal(ctx, L, A) {
    const g = ctx.createLinearGradient(0, 0, 0, A);
    g.addColorStop(0, CINZA_TOPO);
    g.addColorStop(0.45, CINZA);
    g.addColorStop(1, CINZA_FUNDO);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, L, A);

    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, L, A); ctx.clip();
    ctx.translate(L / 2, A / 2);
    ctx.rotate(-0.55);
    ctx.translate(-L, -A);
    for (let i = 0; i < 260; i++) {
      const x = Math.random() * L * 2.4;
      const y = Math.random() * A * 2.4;
      const larg = 5 + Math.random() * 30;
      const alt = 60 + Math.random() * 300;
      const escuro = Math.random() > 0.35;
      const grad = ctx.createLinearGradient(x, y, x + larg, y);
      const cor = escuro ? '0,0,0' : '255,255,255';
      const forca = escuro ? 0.04 + Math.random() * 0.13 : 0.02 + Math.random() * 0.05;
      grad.addColorStop(0, 'rgba(' + cor + ',0)');
      grad.addColorStop(0.5, 'rgba(' + cor + ',' + forca.toFixed(3) + ')');
      grad.addColorStop(1, 'rgba(' + cor + ',0)');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, larg, alt);
    }
    ctx.restore();
  }

  /* Sombreado falso nas laterais, para o tecido não parecer chapado. */
  function sombraLateral(ctx, L, A) {
    [0, L / 2, L].forEach(function (cx) {
      const g = ctx.createLinearGradient(cx - 190, 0, cx + 190, 0);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.5, 'rgba(0,0,0,.34)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(cx - 190, 0, 380, A);
    });
  }

  function painelLateral(ctx, cx, L, A, larguraTopo, larguraBase, topo) {
    [-L, 0, L].forEach(function (d) {
      const x = cx + d;
      const g = ctx.createLinearGradient(x - larguraBase, 0, x + larguraBase, 0);
      g.addColorStop(0, VERMELHO_ESC);
      g.addColorStop(0.45, VERMELHO);
      g.addColorStop(1, VERMELHO_ESC);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x - larguraTopo, topo);
      ctx.lineTo(x + larguraTopo, topo);
      ctx.lineTo(x + larguraBase, A);
      ctx.lineTo(x - larguraBase, A);
      ctx.closePath();
      ctx.fill();
    });
  }

  function chama(ctx, x, y, tam) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(tam, tam);
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.moveTo(0, -1);
    ctx.bezierCurveTo(0.66, -0.24, 0.54, 0.5, 0, 1);
    ctx.bezierCurveTo(-0.54, 0.5, -0.66, -0.24, 0, -1);
    ctx.fill();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.moveTo(0, -0.16);
    ctx.bezierCurveTo(0.3, 0.16, 0.24, 0.56, 0, 0.72);
    ctx.bezierCurveTo(-0.24, 0.56, -0.3, 0.16, 0, -0.16);
    ctx.fill();
    ctx.restore();
  }

  function escudo(ctx, x, y, r) {
    ctx.save();
    ctx.translate(x, y);
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#EE3B44');
    g.addColorStop(1, VERMELHO_ESC);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = r * 0.1;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i - Math.PI / 2;
      const px = Math.cos(a) * r * 0.63, py = Math.sin(a) * r * 0.63;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.stroke();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 ' + (r * 0.8) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('i', 0, r * 0.04);
    ctx.restore();
  }

  function espacado(ctx, texto, x, y, espaco) {
    const larguras = texto.split('').map(function (c) { return ctx.measureText(c).width; });
    const total = larguras.reduce(function (a, b) { return a + b; }, 0) + espaco * (texto.length - 1);
    let px = x - total / 2;
    ctx.textAlign = 'left';
    texto.split('').forEach(function (c, i) {
      ctx.fillText(c, px, y);
      px += larguras[i] + espaco;
    });
    ctx.textAlign = 'center';
  }

  function texturaCamisa() {
    const L = 2048, A = 1024;
    const t = tela(L, A), ctx = t.ctx;
    tramaDiagonal(ctx, L, A);
    painelLateral(ctx, 0, L, A, 34, 96, A * 0.16);
    painelLateral(ctx, L / 2, L, A, 34, 96, A * 0.16);
    sombraLateral(ctx, L, A);

    /* gola vermelha e ombro */
    ctx.fillStyle = VERMELHO;
    ctx.fillRect(0, 0, L, A * 0.045);
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.fillRect(0, A * 0.045, L, 6);

    /* barra inferior */
    ctx.fillStyle = 'rgba(0,0,0,.32)';
    ctx.fillRect(0, A - 14, L, 14);

    /* frente */
    const fx = L * 0.25;
    chama(ctx, fx - 150, A * 0.30, 34);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '600 34px Inter, Helvetica, Arial, sans-serif';
    espacado(ctx, 'UNITY', fx - 150, A * 0.365, 7);
    escudo(ctx, fx + 150, A * 0.325, 62);

    /* costas */
    const bx = L * 0.75;
    ctx.fillStyle = '#FFFFFF';
    ctx.textBaseline = 'alphabetic';
    ctx.font = '600 96px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.fillText('Cidade', bx + 18, A * 0.285);
    ctx.lineWidth = 10;
    ctx.strokeStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(bx - 176, A * 0.253, 42, Math.PI * 0.6, Math.PI * 1.4);
    ctx.stroke();
    ctx.font = '600 34px Inter, Helvetica, Arial, sans-serif';
    espacado(ctx, 'SPORTS', bx + 28, A * 0.335, 15);

    return finalizar(t.c);
  }

  function texturaManga() {
    const L = 1024, A = 512;
    const t = tela(L, A), ctx = t.ctx;
    tramaDiagonal(ctx, L, A);
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.fillRect(0, 0, L, 10);
    return finalizar(t.c);
  }

  function texturaCalcao() {
    const L = 1600, A = 800;
    const t = tela(L, A), ctx = t.ctx;
    const g = ctx.createLinearGradient(0, 0, 0, A);
    g.addColorStop(0, '#E1272F');
    g.addColorStop(0.5, VERMELHO);
    g.addColorStop(1, '#A8161E');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, L, A);

    [0, L / 2, L].forEach(function (cx) {
      const faixa = ctx.createLinearGradient(cx - 30, 0, cx + 30, 0);
      faixa.addColorStop(0, '#33383E');
      faixa.addColorStop(0.5, '#555C64');
      faixa.addColorStop(1, '#33383E');
      ctx.fillStyle = faixa;
      ctx.fillRect(cx - 30, A * 0.12, 60, A);
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.fillRect(cx - 36, A * 0.12, 6, A);
      ctx.fillRect(cx + 30, A * 0.12, 6, A);
    });
    sombraLateral(ctx, L, A);

    ctx.fillStyle = '#1C1F23';
    ctx.fillRect(0, 0, L, A * 0.1);
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    ctx.fillRect(0, A * 0.1, L, 4);

    escudo(ctx, L * 0.25 + 210, A * 0.6, 40);
    return finalizar(t.c);
  }

  function texturaMeia() {
    const L = 512, A = 512;
    const t = tela(L, A), ctx = t.ctx;
    const g = ctx.createLinearGradient(0, 0, 0, A);
    g.addColorStop(0, '#E1272F');
    g.addColorStop(1, '#A8161E');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, L, A);
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    for (let x = 0; x < L; x += 7) ctx.fillRect(x, 0, 3, A);
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.fillRect(0, 0, L, A * 0.14);
    for (let x = 0; x < L; x += 11) { ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(x, 0, 5, A * 0.14); }
    sombraLateral(ctx, L, A);
    return finalizar(t.c);
  }

  /* Relevo sutil de tecido, usado como bump em todas as peças. */
  function texturaRelevo() {
    const n = 512;
    const t = tela(n, n), ctx = t.ctx;
    const img = ctx.createImageData(n, n);
    for (let i = 0; i < n * n; i++) {
      const v = 118 + Math.random() * 40 + (i % n % 3 === 0 ? 12 : 0);
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const tex = finalizar(t.c, true);
    tex.repeat.set(10, 10);
    return tex;
  }

  /* ============================= materiais ============================= */

  let relevo;

  function tecido(textura, aspereza) {
    return new THREE.MeshStandardMaterial({
      map: textura,
      roughness: aspereza === undefined ? 0.88 : aspereza,
      metalness: 0.02,
      bumpMap: relevo,
      bumpScale: 0.008,
      side: THREE.DoubleSide
    });
  }

  function solido(cor, aspereza, metal) {
    return new THREE.MeshStandardMaterial({
      color: cor,
      roughness: aspereza === undefined ? 0.7 : aspereza,
      metalness: metal || 0.05
    });
  }

  /* ============================= montagem ============================= */

  function montarCamisa(grupo) {
    const perfil = [
      { y: 0.00, rx: 1.04, rz: 0.56 },   // barra
      { y: 0.30, rx: 1.00, rz: 0.545 },
      { y: 0.62, rx: 0.95, rz: 0.525 },  // cintura
      { y: 1.00, rx: 0.99, rz: 0.555 },
      { y: 1.34, rx: 1.06, rz: 0.585 },  // peito
      { y: 1.58, rx: 1.12, rz: 0.56 },
      { y: 1.74, rx: 1.10, rz: 0.50 },   // ombro
      { y: 1.88, rx: 0.80, rz: 0.40 },
      { y: 1.99, rx: 0.46, rz: 0.30 },
      { y: 2.04, rx: 0.34, rz: 0.245 }   // gola
    ];
    const camisa = casca(perfil, tecido(texturaCamisa()), {
      aneis: 120, voltas: 128, expoente: 2.35,
      curvaZ: function (t) { return 0.05 * Math.sin(Math.PI * t) * (t > 0.6 ? 0.6 : 1); }
    });
    grupo.add(camisa);

    const gola = new THREE.Mesh(new THREE.TorusGeometry(0.335, 0.045, 20, 64), solido(0xD6202B, 0.62));
    gola.rotation.x = Math.PI / 2;
    gola.scale.y = 0.73;
    gola.position.set(0, 2.045, 0.012);
    gola.castShadow = true;
    grupo.add(gola);

    const vao = new THREE.Mesh(new THREE.CircleGeometry(0.33, 48), solido(0x0C0E11, 1));
    vao.rotation.x = -Math.PI / 2;
    vao.scale.y = 0.73;
    vao.position.set(0, 2.03, 0.012);
    grupo.add(vao);

    const matManga = tecido(texturaManga());
    [-1, 1].forEach(function (lado) {
      const mangaPerfil = [
        { y: 0.10, rx: 0.40, rz: 0.36 },
        { y: -0.20, rx: 0.375, rz: 0.345 },
        { y: -0.55, rx: 0.345, rz: 0.325 },
        { y: -0.86, rx: 0.325, rz: 0.31 }
      ];
      const manga = casca(mangaPerfil, matManga, { aneis: 40, voltas: 64, expoente: 2.2 });
      manga.position.set(lado * 0.74, 1.60, 0.02);
      manga.rotation.z = lado * 0.62;
      grupo.add(manga);

      const punho = new THREE.Mesh(new THREE.CylinderGeometry(0.335, 0.325, 0.13, 48, 1), solido(0xD6202B, 0.66));
      punho.position.set(lado * (0.74 + 0.86 * Math.sin(0.62)), 1.60 - 0.86 * Math.cos(0.62), 0.02);
      punho.rotation.z = lado * 0.62;
      punho.castShadow = true;
      grupo.add(punho);
    });
  }

  function montarCalcao(grupo) {
    const mat = tecido(texturaCalcao(), 0.82);
    const quadril = casca([
      { y: 0.30, rx: 0.96, rz: 0.52 },
      { y: 0.10, rx: 1.00, rz: 0.545 },
      { y: -0.14, rx: 1.06, rz: 0.585 },
      { y: -0.40, rx: 1.06, rz: 0.60 },
      { y: -0.58, rx: 1.02, rz: 0.60 }
    ], mat, { aneis: 60, voltas: 110, expoente: 2.4 });
    grupo.add(quadril);

    const cos = new THREE.Mesh(new THREE.TorusGeometry(0.97, 0.05, 16, 80), solido(0x1C1F23, 0.75));
    cos.rotation.x = Math.PI / 2;
    cos.scale.y = 0.545;
    cos.position.y = 0.29;
    grupo.add(cos);

    [-1, 1].forEach(function (lado) {
      const perna = casca([
        { y: -0.34, rx: 0.52, rz: 0.50 },
        { y: -0.70, rx: 0.51, rz: 0.485 },
        { y: -1.06, rx: 0.485, rz: 0.46 },
        { y: -1.30, rx: 0.455, rz: 0.44 }
      ], mat, { aneis: 44, voltas: 72, expoente: 2.3 });
      perna.position.x = lado * 0.47;
      perna.rotation.z = lado * 0.05;
      grupo.add(perna);
    });

    /* cordão */
    [-1, 1].forEach(function (lado) {
      const cordao = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.3, 12), solido(0xE8E8E8, 0.85));
      cordao.position.set(lado * 0.11, 0.13, 0.53);
      cordao.rotation.x = -0.12;
      cordao.rotation.z = lado * 0.1;
      grupo.add(cordao);
    });
  }

  function montarMeiaEChuteira(grupo) {
    const matMeia = tecido(texturaMeia(), 0.92);

    [-1, 1].forEach(function (lado) {
      const meia = casca([
        { y: -1.24, rx: 0.30, rz: 0.29 },
        { y: -1.44, rx: 0.305, rz: 0.295 },
        { y: -1.66, rx: 0.285, rz: 0.28 },   // panturrilha
        { y: -1.94, rx: 0.225, rz: 0.225 },
        { y: -2.18, rx: 0.175, rz: 0.18 },   // tornozelo
        { y: -2.34, rx: 0.165, rz: 0.175 }
      ], matMeia, { aneis: 54, voltas: 64, expoente: 2.15 });
      meia.position.x = lado * 0.47;
      meia.rotation.z = lado * 0.02;
      grupo.add(meia);

      grupo.add(chuteira(lado));
    });
  }

  function chuteira(lado) {
    const g = new THREE.Group();
    const forma = new THREE.Shape();
    forma.moveTo(-0.26, 0.02);
    forma.lineTo(0.30, 0.0);
    forma.quadraticCurveTo(0.46, 0.0, 0.47, 0.07);
    forma.quadraticCurveTo(0.47, 0.14, 0.32, 0.16);
    forma.quadraticCurveTo(0.10, 0.19, -0.02, 0.27);
    forma.quadraticCurveTo(-0.10, 0.34, -0.19, 0.34);
    forma.quadraticCurveTo(-0.29, 0.33, -0.30, 0.22);
    forma.quadraticCurveTo(-0.31, 0.08, -0.26, 0.02);

    const geo = new THREE.ExtrudeGeometry(forma, {
      depth: 0.24, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.045, bevelSegments: 6, curveSegments: 24
    });
    geo.translate(0, 0, -0.12);
    const couro = new THREE.MeshStandardMaterial({ color: 0x14171A, roughness: 0.42, metalness: 0.12 });
    const pe = new THREE.Mesh(geo, couro);
    pe.rotation.y = -Math.PI / 2;
    pe.castShadow = true;
    g.add(pe);

    const sola = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.05, 0.82), solido(0x08090B, 0.55));
    sola.position.set(0, -0.035, 0.09);
    sola.castShadow = true;
    g.add(sola);

    const risco = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.028, 0.3), solido(0xD6202B, 0.45));
    risco.position.set(0, 0.055, 0.2);
    g.add(risco);

    for (let i = 0; i < 5; i++) {
      const trava = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.028, 0.05, 10), solido(0x0A0B0D, 0.6));
      trava.position.set((i % 2 ? 0.1 : -0.1), -0.075, -0.2 + i * 0.14);
      g.add(trava);
    }

    g.position.set(lado * 0.47, -2.42, 0.06);
    g.rotation.y = lado * 0.06;
    return g;
  }

  function montarKit() {
    const grupo = new THREE.Group();
    montarCamisa(grupo);
    montarCalcao(grupo);
    montarMeiaEChuteira(grupo);
    return grupo;
  }

  /* =============================== cena =============================== */

  function iniciar(elemento) {
    if (typeof THREE === 'undefined') {
      elemento.innerHTML = '<div style="padding:28px;color:#9AA3AE;font-size:14px">' +
        'Não foi possível carregar a visualização 3D. Verifique sua conexão e recarregue a página.</div>';
      return null;
    }
    palco = elemento;
    palco.innerHTML = '';

    cena = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(34, palco.clientWidth / palco.clientHeight, 0.1, 100);
    camera.position.set(0, 0, distancia);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(palco.clientWidth, palco.clientHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    palco.appendChild(renderer.domElement);

    cena.add(new THREE.HemisphereLight(0xdce6f2, 0x14161a, 0.62));

    const principal = new THREE.DirectionalLight(0xffffff, 1.5);
    principal.position.set(3.4, 6, 5.5);
    principal.castShadow = true;
    principal.shadow.mapSize.set(1024, 1024);
    principal.shadow.camera.near = 1;
    principal.shadow.camera.far = 22;
    principal.shadow.camera.left = -4;
    principal.shadow.camera.right = 4;
    principal.shadow.camera.top = 5;
    principal.shadow.camera.bottom = -5;
    principal.shadow.bias = -0.0012;
    cena.add(principal);

    const preenchimento = new THREE.DirectionalLight(0xbcd2ea, 0.5);
    preenchimento.position.set(-5, 1.5, 3.5);
    cena.add(preenchimento);

    const contorno = new THREE.DirectionalLight(0xff6a70, 0.75);
    contorno.position.set(-3.5, 3, -5);
    cena.add(contorno);

    const rebote = new THREE.DirectionalLight(0xffffff, 0.22);
    rebote.position.set(0, -4, 2.5);
    cena.add(rebote);

    relevo = texturaRelevo();
    kit = montarKit();
    kit.position.y = 0.24;
    cena.add(kit);

    const chao = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), new THREE.ShadowMaterial({ opacity: 0.42 }));
    chao.rotation.x = -Math.PI / 2;
    chao.position.y = -2.26;
    chao.receiveShadow = true;
    cena.add(chao);

    ligarControles();
    window.addEventListener('resize', redimensionar);
    animando = true;
    laco();
    return { verFrente: verFrente, verCostas: verCostas, verLado: verLado, destruir: destruir };
  }

  function redimensionar() {
    if (!renderer || !palco || !palco.clientWidth) return;
    camera.aspect = palco.clientWidth / palco.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(palco.clientWidth, palco.clientHeight);
  }

  function ligarControles() {
    let arrastando = false, ultimoX = 0, ultimoY = 0;

    function inicio(x, y) { arrastando = true; ultimoX = x; ultimoY = y; palco.classList.add('arrastando'); }
    function mover(x, y) {
      if (!arrastando) return;
      alvoY += (x - ultimoX) * 0.0095;
      alvoX += (y - ultimoY) * 0.005;
      alvoX = Math.max(-0.42, Math.min(0.42, alvoX));
      ultimoX = x; ultimoY = y;
    }
    function fim() { arrastando = false; palco.classList.remove('arrastando'); }

    palco.addEventListener('mousedown', function (e) { inicio(e.clientX, e.clientY); });
    window.addEventListener('mousemove', function (e) { mover(e.clientX, e.clientY); });
    window.addEventListener('mouseup', fim);
    palco.addEventListener('touchstart', function (e) { inicio(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    palco.addEventListener('touchmove', function (e) { mover(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
    palco.addEventListener('touchend', fim);
    palco.addEventListener('wheel', function (e) {
      e.preventDefault();
      alvoDist = Math.max(4.2, Math.min(9.5, alvoDist + e.deltaY * 0.0035));
    }, { passive: false });
  }

  function laco() {
    if (!animando) return;
    requestAnimationFrame(laco);
    girY += (alvoY - girY) * 0.11;
    girX += (alvoX - girX) * 0.11;
    distancia += (alvoDist - distancia) * 0.09;
    if (kit) { kit.rotation.y = girY; kit.rotation.x = girX; }
    camera.position.z = distancia;
    renderer.render(cena, camera);
  }

  function voltaMaisCurta(destino) {
    return destino + Math.round((alvoY - destino) / (Math.PI * 2)) * Math.PI * 2;
  }

  function verFrente() { alvoY = voltaMaisCurta(0); alvoX = 0.02; }
  function verCostas() { alvoY = voltaMaisCurta(Math.PI); alvoX = 0.02; }
  function verLado() { alvoY = voltaMaisCurta(Math.PI / 2); alvoX = 0.02; }

  function destruir() {
    animando = false;
    window.removeEventListener('resize', redimensionar);
    if (renderer) { renderer.dispose(); renderer = null; }
    cena = null; kit = null;
  }

  return { iniciar: iniciar };
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* =====================================================================
   Cidade Sports — aplicação do solicitante e do administrador
   ===================================================================== */

const estado = {
  token: null,
  usuario: null,
  publico: null,
  config: null,
  tela: 'entrar',
  pedidos: [],
  rascunho: null,
  visor: null,
  admin: { abaAtual: 'pedidos', filtro: 'TODOS', pedidos: [], resumo: {}, pecas: {}, usuarios: [] },
  mensagem: null
};

const el = function (id) { return document.getElementById(id); };
const escapar = function (t) {
  return String(t === null || t === undefined ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
};
const moeda = function (v) { return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ','); };

/* --------------------------- ponte com o servidor --------------------------- */

/* Endereço do app da web publicado no Apps Script (termina em /exec).
   Se um dia você reimplantar gerando uma URL nova, troque só esta linha. */
const URL_API = 'https://script.google.com/macros/s/AKfycbyGUOJUBtTamNxIzm9WEt0-iGY0Wn544-0vZIimxDLDH2jmWhvDRVCCC7pMVu_-iJEKIg/exec';

function chamar(acao, dados) {
  const carga = Object.assign({ token: estado.token }, dados || {});

  /* Servido pelo próprio Apps Script: usa a ponte interna. */
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (r) { r && r.ok ? resolve(r.dados) : reject(erroServidor(r ? r.erro : 'Falha inesperada.')); })
        .withFailureHandler(function (e) { reject(new Error(e && e.message ? e.message : String(e))); })
        .api(acao, carga);
    });
  }

  /* Servido pelo GitHub Pages ou por qualquer outro endereço: chama a API. */
  if (!URL_API || URL_API.indexOf('/exec') === -1) {
    return Promise.reject(new Error('Preencha a constante URL_API no topo do arquivo com o endereço do app da web.'));
  }

  return porPost(acao, carga).catch(function (e) {
    if (e.doServidor) throw e;
    if (carga.arquivo) throw new Error('O comprovante não foi enviado. Confira a conexão e tente de novo.');
    return porJsonp(acao, carga);
  });
}

function erroServidor(mensagem) {
  const e = new Error(mensagem);
  e.doServidor = true;
  return e;
}

function porPost(acao, carga) {
  return fetch(URL_API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ acao: acao, dados: carga }),
    redirect: 'follow'
  }).then(function (r) { return r.json(); })
    .then(function (r) {
      if (!r || !r.ok) throw erroServidor(r && r.erro ? r.erro : 'Falha inesperada.');
      return r.dados;
    });
}

/* Reserva para navegadores que barram a chamada direta. Só para dados pequenos. */
function porJsonp(acao, carga) {
  return new Promise(function (resolve, reject) {
    const nome = 'cs_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const tempo = setTimeout(function () { limpar(); reject(new Error('O servidor demorou para responder.')); }, 25000);
    function limpar() { clearTimeout(tempo); delete window[nome]; script.remove(); }
    window[nome] = function (r) {
      limpar();
      if (!r || !r.ok) reject(erroServidor(r && r.erro ? r.erro : 'Falha inesperada.'));
      else resolve(r.dados);
    };
    script.onerror = function () { limpar(); reject(new Error('Não foi possível falar com o servidor.')); };
    script.src = URL_API + '?acao=' + encodeURIComponent(acao) +
      '&dados=' + encodeURIComponent(JSON.stringify(carga)) + '&callback=' + nome;
    document.body.appendChild(script);
  });
}

function avisar(texto, tipo) {
  estado.mensagem = { texto: texto, tipo: tipo || 'ok' };
  const caixa = el('mensagem');
  if (caixa) {
    caixa.innerHTML = '<div class="aviso ' + estado.mensagem.tipo + '">' + escapar(texto) + '</div>';
    caixa.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function limparAviso() { estado.mensagem = null; const c = el('mensagem'); if (c) c.innerHTML = ''; }

function ocupado(botao, ligado, textoOriginal) {
  if (!botao) return;
  botao.disabled = ligado;
  if (ligado) { botao.dataset.antes = botao.textContent; botao.textContent = 'Aguarde…'; }
  else { botao.textContent = textoOriginal || botao.dataset.antes || botao.textContent; }
}

/* ------------------------------- inicialização ------------------------------- */

window.addEventListener('DOMContentLoaded', function () {
  chamar('publico').then(function (p) {
    estado.publico = p;
    const salvo = sessionStorage.getItem('cs_token');
    if (salvo) {
      estado.token = salvo;
      return chamar('sessao').then(function (u) {
        estado.usuario = u;
        return carregarConfig().then(function () {
          return irPara(u.perfil === 'admin' ? 'admin' : 'inicio');
        });
      }).catch(function () { estado.token = null; sessionStorage.removeItem('cs_token'); desenhar('entrar'); });
    }
    desenhar('entrar');
  }).catch(function (e) {
    document.getElementById('app').innerHTML =
      '<main><div class="cartao destaque"><h2>Não foi possível iniciar</h2>' +
      '<p class="sub">' + escapar(e.message) + '</p></div></main>';
  });
});

/* Preços, situações e demais regras vêm do servidor, e só depois do login. */
function carregarConfig() {
  return chamar('config').then(function (cfg) { estado.config = cfg; return cfg; });
}

function irPara(tela) {
  if (tela === 'inicio') {
    return chamar('meusPedidos').then(function (p) { estado.pedidos = p; desenhar('inicio'); });
  }
  if (tela === 'admin') {
    return carregarAdmin();
  }
  desenhar(tela);
  return Promise.resolve();
}

function desenhar(tela) {
  if (tela) estado.tela = tela;
  const partes = [cabecalho()];
  partes.push('<main><div id="mensagem"></div>');
  switch (estado.tela) {
    case 'entrar': partes.push(telaEntrar()); break;
    case 'cadastrar': partes.push(telaCadastrar()); break;
    case 'inicio': partes.push(telaInicio()); break;
    case 'solicitar': partes.push(telaSolicitar()); break;
    case 'admin': partes.push(telaAdmin()); break;
    case 'senha': partes.push(telaSenha()); break;
  }
  partes.push(cartaoSuporte());
  partes.push('</main>');
  el('app').innerHTML = partes.join('');
  if (estado.mensagem) avisar(estado.mensagem.texto, estado.mensagem.tipo);
  if (estado.tela === 'solicitar' && estado.rascunho.etapa === 1) montarVisor();
  if (estado.tela === 'solicitar' && estado.rascunho.etapa === 2 && estado.rascunho.qrAberto) desenharQr();
  aplicarMascaras();
}

/* --------------------------------- topo --------------------------------- */

function cabecalho() {
  let direita = '';
  if (estado.usuario) {
    direita =
      '<div class="quem"><b>' + escapar(estado.usuario.nome) + '</b>' +
      '<small>' + (estado.usuario.perfil === 'admin' ? 'Administrador' : 'Solicitante') + '</small></div>' +
      (estado.usuario.perfil === 'admin' && estado.tela !== 'admin'
        ? '<button class="secundario pequeno" onclick="irPara(\'admin\')">Painel</button>' : '') +
      (estado.tela !== 'inicio' && estado.usuario.perfil !== 'admin'
        ? '<button class="secundario pequeno" onclick="irPara(\'inicio\')">Meus pedidos</button>' : '') +
      '<button class="secundario pequeno" onclick="desenhar(\'senha\')">Senha</button>' +
      '<button class="secundario pequeno" onclick="sair()">Sair</button>';
  }
  return '<header class="topo"><div class="marca">Cidade <span>SPORTS</span></div>' +
    '<div class="espaco"></div>' + direita + '</header>';
}

function cartaoSuporte() {
  const s = (estado.publico && estado.publico.suporte) || (estado.config && estado.config.suporte);
  if (!s) return '';
  const zap = 'https://wa.me/55' + s.fone.replace(/\D/g, '');
  const estreita = ['entrar', 'cadastrar', 'senha'].indexOf(estado.tela) !== -1;
  const abre = estreita ? '<div class="centro">' : '';
  const fecha = estreita ? '</div>' : '';
  return abre + '<div class="suporte"><div><b>Deu algum problema?</b>' +
    '<p>Fale com ' + escapar(s.nome) + ' pelo WhatsApp ' + escapar(s.fone) + ' e resolvemos junto com você.</p></div>' +
    '<a href="' + zap + '" target="_blank" rel="noopener"><button class="pequeno">Chamar no WhatsApp</button></a></div>' + fecha;
}

/* ------------------------------ entrar/cadastro ------------------------------ */

function telaEntrar() {
  return '<div class="centro"><h1>Uniforme do time</h1>' +
    '<p class="sub" style="color:var(--texto-fraco);margin:6px 0 20px">Use o WhatsApp do seu cadastro. Quem tem nome de usuário pode entrar por ele.</p>' +
    '<div class="cartao destaque">' +
    '<div class="campo"><label for="e_login">Usuário ou WhatsApp</label>' +
    '<input id="e_login" data-mascara="login" autocapitalize="none" placeholder="seu.usuario ou (12) 90000-0000"></div>' +
    '<div class="campo"><label for="e_senha">Senha</label>' +
    '<input id="e_senha" type="password" placeholder="Sua senha" onkeydown="if(event.key===\'Enter\')entrar(this)"></div>' +
    '<div class="acoes"><button onclick="entrar(this)">Entrar</button>' +
    '<button class="texto" onclick="desenhar(\'cadastrar\')">Ainda não tenho cadastro</button></div>' +
    '</div></div>';
}

function telaCadastrar() {
  return '<div class="centro"><h1>Criar cadastro</h1>' +
    '<p class="sub" style="color:var(--texto-fraco);margin:6px 0 20px">Leva menos de um minuto.</p>' +
    '<div class="cartao destaque">' +
    '<div class="campo"><label for="c_nome">Nome completo</label><input id="c_nome" placeholder="Como você quer ser chamado"></div>' +
    '<div class="campo"><label for="c_fone">WhatsApp</label><input id="c_fone" data-mascara="fone" inputmode="numeric" placeholder="(12) 90000-0000"></div>' +
    '<div class="campo"><label for="c_nasc">Data de nascimento</label><input id="c_nasc" type="date"></div>' +
    '<div class="campo"><label for="c_senha">Crie uma senha</label><input id="c_senha" type="password" placeholder="Mínimo de 6 caracteres"></div>' +
    '<div class="acoes"><button onclick="cadastrar(this)">Criar cadastro</button>' +
    '<button class="texto" onclick="desenhar(\'entrar\')">Já tenho cadastro</button></div>' +
    '</div></div>';
}

function entrar(botao) {
  limparAviso();
  ocupado(botao, true);
  chamar('entrar', { login: el('e_login').value, senha: el('e_senha').value })
    .then(function (s) {
      estado.token = s.token; estado.usuario = s.usuario;
      sessionStorage.setItem('cs_token', s.token);
      return carregarConfig().then(function () {
        if (s.usuario.senhaTemporaria) {
          avisar('Você está usando a senha padrão. Crie uma senha sua para continuar.', 'atencao');
          desenhar('senha');
        } else {
          irPara(s.usuario.perfil === 'admin' ? 'admin' : 'inicio');
        }
      });
    })
    .catch(function (e) { ocupado(botao, false, 'Entrar'); avisar(e.message, 'erro'); });
}

function cadastrar(botao) {
  limparAviso();
  ocupado(botao, true);
  const nasc = el('c_nasc').value;
  chamar('cadastrar', {
    nome: el('c_nome').value,
    whatsapp: el('c_fone').value,
    nascimento: nasc ? nasc.split('-').reverse().join('/') : '',
    senha: el('c_senha').value
  }).then(function (s) {
    estado.token = s.token; estado.usuario = s.usuario;
    sessionStorage.setItem('cs_token', s.token);
    return carregarConfig().then(function () {
      return irPara('inicio').then(function () { avisar('Cadastro criado. Bem-vindo, ' + s.usuario.nome + '.', 'ok'); });
    });
  }).catch(function (e) { ocupado(botao, false, 'Criar cadastro'); avisar(e.message, 'erro'); });
}

function sair() {
  chamar('sair').catch(function () {}).then(function () {
    sessionStorage.removeItem('cs_token');
    estado.token = null; estado.usuario = null; estado.pedidos = []; estado.rascunho = null;
    desenhar('entrar');
  });
}

function telaSenha() {
  return '<div class="centro"><h1>Trocar senha</h1><div class="cartao destaque">' +
    '<div class="campo"><label for="s_atual">Senha atual</label><input id="s_atual" type="password"></div>' +
    '<div class="campo"><label for="s_nova">Nova senha</label><input id="s_nova" type="password" placeholder="Mínimo de 6 caracteres"></div>' +
    '<div class="acoes"><button onclick="trocarSenha(this)">Salvar nova senha</button>' +
    '<button class="secundario" onclick="irPara(estado.usuario.perfil===\'admin\'?\'admin\':\'inicio\')">Voltar</button></div>' +
    '</div></div>';
}

function trocarSenha(botao) {
  limparAviso();
  ocupado(botao, true);
  chamar('trocarSenha', { senhaAtual: el('s_atual').value, novaSenha: el('s_nova').value })
    .then(function () {
      estado.usuario.senhaTemporaria = false;
      irPara(estado.usuario.perfil === 'admin' ? 'admin' : 'inicio')
        .then(function () { avisar('Senha alterada.', 'ok'); });
    })
    .catch(function (e) { ocupado(botao, false, 'Salvar nova senha'); avisar(e.message, 'erro'); });
}

/* --------------------------------- máscaras --------------------------------- */

function aplicarMascaras() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-mascara]'), function (campo) {
    campo.addEventListener('input', function () {
      if (campo.dataset.mascara === 'login' && /[a-zA-Z@._-]/.test(campo.value)) return;
      let d = campo.value.replace(/\D/g, '').slice(0, 11);
      let saida = '';
      if (d.length) saida = '(' + d.slice(0, 2);
      if (d.length >= 2) saida += ') ' + d.slice(2, d.length > 10 ? 7 : 6);
      if (d.length > (d.length > 10 ? 7 : 6)) saida += '-' + d.slice(d.length > 10 ? 7 : 6);
      campo.value = saida;
    });
  });
}

/* ------------------------------ início solicitante ------------------------------ */

function corDoStatus(s) {
  const S = estado.config.status;
  if (s === S.AGUARDANDO_COMPROVANTE) return 'cinza';
  if (s === S.EM_ANALISE) return 'ambar';
  if (s === S.CORRECAO) return 'vermelho';
  if (s === S.ACEITO) return 'azul';
  if (s === S.DISPONIVEL) return 'verde';
  if (s === S.ENTREGUE) return 'verde';
  return 'cinza';
}

function telaInicio() {
  const S = estado.config.status;
  let html = '<h1>Meus pedidos</h1>' +
    '<p class="sub" style="color:var(--texto-fraco);margin:6px 0 20px">Acompanhe aqui cada etapa do seu uniforme.</p>' +
    '<div class="acoes" style="margin-bottom:22px"><button onclick="novaSolicitacao()">Solicitar uniforme</button></div>';

  if (!estado.pedidos.length) {
    html += '<div class="cartao"><h3>Nenhum pedido ainda</h3>' +
      '<p class="sub">Toque em “Solicitar uniforme” para ver o modelo em 3D e escolher os tamanhos.</p></div>';
    return html;
  }

  estado.pedidos.forEach(function (p) {
    html += '<div class="pedido"><div class="cab">' +
      '<span class="id">' + escapar(p.id) + '</span>' +
      '<span class="selo ' + corDoStatus(p.status) + '">' + escapar(p.status) + '</span>' +
      '<span class="espaco"></span><b>' + moeda(p.total) + '</b></div>' +
      '<div class="corpo">';

    if (p.status === S.CORRECAO) {
      html += '<div class="aviso erro"><b>O administrador pediu um ajuste:</b><br>' + escapar(p.observacaoAdmin) + '</div>';
    }
    if (p.status === S.DISPONIVEL) {
      html += '<div class="aviso ok">Uniforme disponível para entrega. Combine a retirada com ' +
        escapar(estado.config.suporte.nome) + '.</div>';
    }

    html += '<ul>';
    p.itens.forEach(function (i) {
      html += '<li><span>' + escapar(i.rotulo) + ' — ' +
        (i.para === 'eu' ? 'para mim' : escapar(i.nomeUso)) + ' × ' + i.quantidade + '</span>' +
        '<span>' + moeda(i.subtotal) + '</span></li>';
    });
    html += '</ul>';

    if (p.comprovanteUrl) {
      html += '<p style="margin-top:10px"><a href="' + escapar(p.comprovanteUrl) + '" target="_blank" rel="noopener">Ver comprovante enviado</a></p>';
    }

    html += '<div class="linha-tempo">';
    p.historico.slice(-4).forEach(function (h) {
      html += '<div>' + escapar(h.quando) + ' — ' + escapar(h.oque) + '</div>';
    });
    html += '</div>';

    if (p.status === S.AGUARDANDO_COMPROVANTE || p.status === S.CORRECAO) {
      html += '<div class="acoes" style="margin-top:14px">' +
        '<button class="pequeno" onclick="retomarPedido(\'' + p.id + '\')">Continuar pedido</button>' +
        '<button class="secundario pequeno" onclick="cancelarPedido(\'' + p.id + '\')">Cancelar pedido</button></div>';
    }
    html += '</div></div>';
  });
  return html;
}

function cancelarPedido(id) {
  if (!confirm('Cancelar este pedido?')) return;
  chamar('cancelarPedido', { pedidoId: id })
    .then(function () { irPara('inicio').then(function () { avisar('Pedido cancelado.', 'ok'); }); })
    .catch(function (e) { avisar(e.message, 'erro'); });
}

/* ------------------------------ fluxo de pedido ------------------------------ */

function novaSolicitacao() {
  estado.rascunho = {
    etapa: 1, pedido: null, qrAberto: false, arquivo: null, pix: null,
    itens: [{ para: 'eu', nomeUso: '', tamanho: '', quantidade: 1 }]
  };
  desenhar('solicitar');
}

function retomarPedido(id) {
  const p = estado.pedidos.filter(function (x) { return x.id === id; })[0];
  estado.rascunho = {
    etapa: 2,
    itens: p.itens.map(function (i) {
      return { para: i.para, nomeUso: i.nomeUso, tamanho: i.tamanho, quantidade: i.quantidade };
    }),
    pedido: p, qrAberto: false, arquivo: null, pix: null
  };
  desenhar('solicitar');
}

function telaSolicitar() {
  const r = estado.rascunho;
  const passos = ['Escolher o uniforme', 'Pagar com PIX', 'Acompanhar'];
  let html = '<div class="etapas">';
  passos.forEach(function (nome, i) {
    const n = i + 1;
    html += '<div class="' + (r.etapa === n ? 'ativa' : (r.etapa > n ? 'feita' : '')) + '">' +
      '<b>' + n + '</b>' + nome + '</div>';
  });
  html += '</div>';

  if (r.etapa === 1) html += etapaUniforme();
  if (r.etapa === 2) html += etapaPagamento();
  if (r.etapa === 3) html += etapaAcompanhar();
  return html;
}

/* etapa 1 ------------------------------------------------------------------ */

function etapaUniforme() {
  const r = estado.rascunho;
  const precos = estado.config.precos;

  let html = '<div class="grade duas" style="align-items:start">' +
    '<div><div class="palco" id="palco"></div>' +
    '<div class="palco vistas" style="position:static;height:auto;border:none;background:none;margin-top:10px;display:flex;gap:8px">' +
    '<button class="secundario pequeno" onclick="estado.visor&&estado.visor.verFrente()">Frente</button>' +
    '<button class="secundario pequeno" onclick="estado.visor&&estado.visor.verLado()">Lateral</button>' +
    '<button class="secundario pequeno" onclick="estado.visor&&estado.visor.verCostas()">Costas</button>' +
    '</div>' +
    '<small style="display:block;margin-top:8px">Arraste com o mouse para girar. Use a rolagem para aproximar.</small></div>';

  html += '<div class="cartao destaque"><h2>Escolha os uniformes</h2>' +
    '<p class="sub">Dá para pedir para você, para os filhos ou para os dois no mesmo pedido.</p>';

  html += '<div id="itens">';
  r.itens.forEach(function (item, idx) {
      html += '<div class="item"><div class="topo-item"><b>Uniforme ' + (idx + 1) + '</b>' +
        (r.itens.length > 1 ? '<button class="texto" onclick="removerItem(' + idx + ')">Remover</button>' : '') +
        '</div>';

      html += '<div class="campo"><label>Para quem</label><select onchange="mudarItem(' + idx + ',\'para\',this.value)">' +
        '<option value="eu"' + (item.para === 'eu' ? ' selected' : '') + '>Para mim</option>' +
        '<option value="filho"' + (item.para === 'filho' ? ' selected' : '') + '>Para meu filho(a)</option>' +
        '</select></div>';

      if (item.para === 'filho') {
        html += '<div class="campo"><label>Nome do filho(a)</label>' +
          '<input value="' + escapar(item.nomeUso) + '" placeholder="Nome de quem vai usar" ' +
          'onchange="mudarItem(' + idx + ',\'nomeUso\',this.value)"></div>';
      }

      html += '<div class="linha"><div class="campo"><label>Tamanho</label>' +
        '<select onchange="mudarItem(' + idx + ',\'tamanho\',this.value)">' +
        '<option value="">Escolha o tamanho</option>';
      Object.keys(precos).forEach(function (chave) {
        html += '<option value="' + chave + '"' + (item.tamanho === chave ? ' selected' : '') + '>' +
          escapar(precos[chave].rotulo) + ' — ' + moeda(precos[chave].valor) + '</option>';
      });
      html += '</select></div>' +
        '<div class="campo"><label>Quantidade</label>' +
        '<input type="number" min="1" max="20" value="' + item.quantidade + '" ' +
        'onchange="mudarItem(' + idx + ',\'quantidade\',this.value)"></div>' +
        '<div class="campo" style="text-align:right"><label>Subtotal</label>' +
        '<div style="padding:11px 0;font-weight:600">' +
        moeda(item.tamanho ? precos[item.tamanho].valor * item.quantidade : 0) + '</div></div>' +
        '</div></div>';
    });
    html += '</div>';

    html += '<button class="secundario pequeno" onclick="adicionarItem()">Adicionar outro uniforme</button>';
    html += '<div class="total"><span>Total do pedido</span><b>' + moeda(totalRascunho()) + '</b></div>';
    html += '<p style="margin-top:6px"><small>Infantil é um pouco menor que o M.</small></p>';
    html += '<div class="acoes" style="margin-top:16px">' +
      '<button onclick="irParaPagamento(this)">Ir para o pagamento</button>' +
      '<button class="secundario" onclick="irPara(\'inicio\')">Voltar</button></div>';

  html += '</div></div>';
  return html;
}

function montarVisor() {
  const palco = el('palco');
  if (!palco) return;
  if (estado.visor && estado.visor.destruir) estado.visor.destruir();
  estado.visor = Uniforme3D.iniciar(palco);
}

function adicionarItem() {
  const ultimo = estado.rascunho.itens[estado.rascunho.itens.length - 1];
  estado.rascunho.itens.push({ para: ultimo ? ultimo.para : 'eu', nomeUso: '', tamanho: '', quantidade: 1 });
  desenhar();
}

function removerItem(idx) {
  estado.rascunho.itens.splice(idx, 1);
  desenhar();
}

function mudarItem(idx, campo, valor) {
  const item = estado.rascunho.itens[idx];
  item[campo] = campo === 'quantidade' ? Math.max(1, Math.min(20, parseInt(valor, 10) || 1)) : valor;
  if (campo === 'para' && valor === 'eu') item.nomeUso = '';
  desenhar();
}

function totalRascunho() {
  const precos = estado.config.precos;
  return estado.rascunho.itens.reduce(function (s, i) {
    return s + (i.tamanho ? precos[i.tamanho].valor * i.quantidade : 0);
  }, 0);
}

function irParaPagamento(botao) {
  limparAviso();
  const r = estado.rascunho;
  const faltando = r.itens.filter(function (i) { return !i.tamanho || (i.para === 'filho' && !i.nomeUso.trim()); });
  if (faltando.length) { avisar('Complete o tamanho e o nome de quem vai usar em todos os uniformes.', 'erro'); return; }

  ocupado(botao, true);
  const acao = r.pedido ? 'editarPedido' : 'criarPedido';
  const dados = { itens: r.itens };
  if (r.pedido) dados.pedidoId = r.pedido.id;

  chamar(acao, dados).then(function (resposta) {
    if (!r.pedido) r.pedido = resposta;
    else { r.pedido.itens = r.itens.slice(); r.pedido.total = totalRascunho(); }
    r.etapa = 2;
    desenhar();
  }).catch(function (e) { ocupado(botao, false, 'Ir para o pagamento'); avisar(e.message, 'erro'); });
}

/* etapa 2 — PIX ----------------------------------------------------------- */

function etapaPagamento() {
  const r = estado.rascunho;
  const total = r.pedido ? r.pedido.total : totalRascunho();

  let html = '<div class="cartao destaque"><h2>Pagamento por PIX</h2>' +
    '<p class="sub">Pedido ' + escapar(r.pedido.id) + ' — valor total ' + moeda(total) + '</p>';

  if (r.pedido.status === estado.config.status.CORRECAO) {
    html += '<div class="aviso erro"><b>Ajuste pedido pelo administrador:</b><br>' +
      escapar(r.pedido.observacaoAdmin) + '</div>';
  }

  html += '<div class="acoes" style="margin-bottom:18px">' +
    '<button onclick="abrirQr(this)">Ver QR Code</button>' +
    '<button class="secundario" onclick="copiarChave(this)">Copiar chave PIX</button>' +
    '<button class="secundario" onclick="voltarEtapa1()">Alterar uniformes</button></div>';

  if (r.qrAberto && r.pix) {
    html += '<div class="pix"><div class="qr" id="qr"></div><div class="lado">' +
      '<label>Chave PIX (e-mail)</label>' +
      '<code class="chave">' + escapar(r.pix.chave) + '</code>' +
      '<label>PIX copia e cola</label>' +
      '<code class="chave" id="brcode">' + escapar(r.pix.copiaECola) + '</code>' +
      '<button class="secundario pequeno" onclick="copiarTexto(document.getElementById(\'brcode\').textContent,this)">Copiar código</button>' +
      '</div></div>';
  }

  if (r.qrAberto || r.chaveCopiada) {
    html += '<div style="margin-top:22px;border-top:1px solid var(--linha);padding-top:20px">' +
      '<h3>Anexar comprovante</h3>' +
      '<p class="sub">Envie o print ou o PDF do comprovante. Aceita imagem ou PDF de até 8 MB.</p>' +
      '<div class="campo"><input type="file" id="arquivo" accept="image/*,application/pdf" onchange="lerArquivo(this)"></div>' +
      '<div id="previa"></div>' +
      '<div class="acoes"><button onclick="enviarComprovante(this)">Enviar comprovante</button>' +
      '<button class="secundario" onclick="irPara(\'inicio\')">Enviar depois</button></div></div>';
  }

  html += '</div>';
  return html;
}

function voltarEtapa1() { estado.rascunho.etapa = 1; desenhar(); }

/* A chave e o código copia e cola são montados no servidor, com o valor do pedido. */
function carregarPix() {
  const r = estado.rascunho;
  if (r.pix) return Promise.resolve(r.pix);
  return chamar('pix', { pedidoId: r.pedido.id }).then(function (p) { r.pix = p; return p; });
}

function abrirQr(botao) {
  limparAviso();
  ocupado(botao, true);
  carregarPix()
    .then(function () { estado.rascunho.qrAberto = true; desenhar(); })
    .catch(function (e) { ocupado(botao, false, 'Ver QR Code'); avisar(e.message, 'erro'); });
}

function copiarChave(botao) {
  limparAviso();
  ocupado(botao, true);
  carregarPix().then(function (pix) {
    copiarTexto(pix.chave);
    estado.rascunho.chaveCopiada = true;
    desenhar();
    avisar('Chave PIX copiada. Agora anexe o comprovante abaixo.', 'ok');
  }).catch(function (e) { ocupado(botao, false, 'Copiar chave PIX'); avisar(e.message, 'erro'); });
}

function copiarTexto(texto, botao) {
  const rotulo = botao ? botao.textContent : '';
  const feito = function () { if (botao) { botao.textContent = 'Copiado'; setTimeout(function () { botao.textContent = rotulo; }, 1800); } };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(feito).catch(function () { copiaAntiga(texto); feito(); });
  } else { copiaAntiga(texto); feito(); }
}

function copiaAntiga(texto) {
  const area = document.createElement('textarea');
  area.value = texto;
  area.style.position = 'fixed'; area.style.opacity = '0';
  document.body.appendChild(area); area.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(area);
}

function desenharQr() {
  const alvo = el('qr');
  if (!alvo || !estado.rascunho.pix) return;
  alvo.innerHTML = '';
  if (typeof QRCode !== 'undefined') {
    new QRCode(alvo, { text: estado.rascunho.pix.copiaECola, width: 190, height: 190, correctLevel: QRCode.CorrectLevel.M });
  } else {
    alvo.innerHTML = '<div style="color:#333;font-size:12px;width:190px">Não foi possível gerar a imagem do QR Code. ' +
      'Use a chave PIX ou o código copia e cola ao lado.</div>';
  }
}

function lerArquivo(campo) {
  const arquivo = campo.files[0];
  const previa = el('previa');
  if (!arquivo) { estado.rascunho.arquivo = null; previa.innerHTML = ''; return; }
  if (arquivo.size > 8 * 1024 * 1024) {
    previa.innerHTML = '<div class="aviso erro">Arquivo maior que 8 MB. Envie uma imagem menor.</div>';
    campo.value = ''; return;
  }
  const leitor = new FileReader();
  leitor.onload = function () {
    estado.rascunho.arquivo = {
      nome: arquivo.name, tipo: arquivo.type,
      base64: String(leitor.result).split(',')[1]
    };
    previa.innerHTML = arquivo.type.indexOf('image') === 0
      ? '<img src="' + leitor.result + '" style="max-width:220px;border-radius:8px;border:1px solid var(--linha);margin-bottom:14px">'
      : '<div class="aviso ok">' + escapar(arquivo.name) + ' pronto para envio.</div>';
  };
  leitor.readAsDataURL(arquivo);
}

function enviarComprovante(botao) {
  limparAviso();
  if (!estado.rascunho.arquivo) { avisar('Anexe o comprovante antes de enviar.', 'erro'); return; }
  ocupado(botao, true);
  chamar('enviarComprovante', { pedidoId: estado.rascunho.pedido.id, arquivo: estado.rascunho.arquivo })
    .then(function () {
      estado.rascunho.etapa = 3;
      desenhar();
    })
    .catch(function (e) { ocupado(botao, false, 'Enviar comprovante'); avisar(e.message, 'erro'); });
}

/* etapa 3 ------------------------------------------------------------------ */

function etapaAcompanhar() {
  const r = estado.rascunho;
  return '<div class="cartao destaque"><h2>Comprovante enviado</h2>' +
    '<p class="sub">Pedido ' + escapar(r.pedido.id) + ' — ' + moeda(r.pedido.total) + '</p>' +
    '<div class="aviso ok">Agora é com a equipe: o administrador confere o pagamento e aceita o pedido. ' +
    'Se faltar algo, você recebe aqui a orientação do que corrigir.</div>' +
    '<p>Depois do aceite, o pedido fica como <b>aceito — aguardando recebimento</b> e, quando os uniformes chegarem, ' +
    'muda para <b>disponível para entrega</b>.</p>' +
    '<div class="acoes" style="margin-top:16px"><button onclick="irPara(\'inicio\')">Ver meus pedidos</button></div></div>';
}

/* ---------------------------------- admin ---------------------------------- */

function carregarAdmin() {
  return Promise.all([chamar('adminPedidos'), chamar('adminUsuarios')])
    .then(function (r) {
      estado.admin.pedidos = r[0].pedidos;
      estado.admin.resumo = r[0].resumo;
      estado.admin.pecas = r[0].pecas;
      estado.admin.usuarios = r[1];
      desenhar('admin');
    })
    .catch(function (e) { avisar(e.message, 'erro'); });
}

function telaAdmin() {
  let html = '<h1>Painel do administrador</h1>' +
    '<div class="abas">' +
    '<button class="' + (estado.admin.abaAtual === 'pedidos' ? 'marcada' : '') + '" onclick="abaAdmin(\'pedidos\')">Pedidos</button>' +
    '<button class="' + (estado.admin.abaAtual === 'usuarios' ? 'marcada' : '') + '" onclick="abaAdmin(\'usuarios\')">Usuários</button>' +
    '<button class="' + (estado.admin.abaAtual === 'relatorios' ? 'marcada' : '') + '" onclick="abaAdmin(\'relatorios\')">Relatórios</button>' +
    '</div>';
  if (estado.admin.abaAtual === 'pedidos') html += adminPedidos();
  if (estado.admin.abaAtual === 'usuarios') html += adminUsuarios();
  if (estado.admin.abaAtual === 'relatorios') html += adminRelatorios();
  return html;
}

function abaAdmin(aba) { estado.admin.abaAtual = aba; desenhar(); }

function adminPedidos() {
  const S = estado.config.status;
  const ordem = [S.EM_ANALISE, S.CORRECAO, S.ACEITO, S.DISPONIVEL, S.AGUARDANDO_COMPROVANTE, S.ENTREGUE, S.CANCELADO];

  let html = '<div class="numeros">';
  ordem.forEach(function (s) {
    html += '<div><b>' + (estado.admin.resumo[s] || 0) + '</b><span>' + escapar(s) + '</span></div>';
  });
  html += '</div>';

  html += '<div class="filtros"><button class="' + (estado.admin.filtro === 'TODOS' ? 'marcada' : '') +
    '" onclick="filtrarAdmin(\'TODOS\')">Todos</button>';
  ordem.forEach(function (s) {
    html += '<button class="' + (estado.admin.filtro === s ? 'marcada' : '') + '" onclick="filtrarAdmin(\'' +
      s.replace(/'/g, '') + '\')">' + escapar(s) + '</button>';
  });
  html += '</div>';

  const lista = estado.admin.pedidos.filter(function (p) {
    return estado.admin.filtro === 'TODOS' || p.status === estado.admin.filtro;
  });

  if (!lista.length) return html + '<div class="cartao"><h3>Nada nesta etapa</h3><p class="sub">Assim que chegar um pedido nesta situação ele aparece aqui.</p></div>';

  lista.forEach(function (p) {
    html += '<div class="pedido"><div class="cab">' +
      '<span class="id">' + escapar(p.id) + '</span>' +
      '<span class="selo ' + corDoStatus(p.status) + '">' + escapar(p.status) + '</span>' +
      '<span class="espaco"></span>' +
      '<span>' + escapar(p.nome) + ' · ' + escapar(p.whatsapp) + '</span>' +
      '<b>' + moeda(p.total) + '</b></div><div class="corpo"><ul>';
    p.itens.forEach(function (i) {
      html += '<li><span>' + escapar(i.rotulo) + ' — ' + (i.para === 'eu' ? 'para o solicitante' : escapar(i.nomeUso)) +
        ' × ' + i.quantidade + '</span><span>' + moeda(i.subtotal) + '</span></li>';
    });
    html += '</ul>';

    if (p.comprovanteUrl) {
      html += '<p style="margin-top:10px"><a href="' + escapar(p.comprovanteUrl) + '" target="_blank" rel="noopener">Abrir comprovante</a></p>';
    } else {
      html += '<p style="margin-top:10px"><small>Sem comprovante anexado.</small></p>';
    }
    if (p.observacaoAdmin) html += '<div class="aviso atencao" style="margin-top:10px">Correção pedida: ' + escapar(p.observacaoAdmin) + '</div>';

    html += '<div class="acoes" style="margin-top:14px">' + botoesAdmin(p) + '</div>';

    html += '<div class="linha-tempo">';
    p.historico.slice(-5).forEach(function (h) {
      html += '<div>' + escapar(h.quando) + ' · ' + escapar(h.quem) + ' — ' + escapar(h.oque) + '</div>';
    });
    html += '</div></div></div>';
  });
  return html;
}

function botoesAdmin(p) {
  const S = estado.config.status;
  const b = function (rotulo, status, classe) {
    return '<button class="' + (classe || '') + ' pequeno" onclick="mudarStatus(\'' + p.id + '\',\'' +
      status.replace(/'/g, '') + '\')">' + rotulo + '</button>';
  };
  let html = '';
  if (p.status === S.EM_ANALISE) {
    html += b('Aceitar pedido', S.ACEITO);
    html += '<button class="secundario pequeno" onclick="pedirCorrecao(\'' + p.id + '\')">Pedir correção</button>';
  }
  if (p.status === S.ACEITO) html += b('Uniforme recebido — liberar entrega', S.DISPONIVEL);
  if (p.status === S.DISPONIVEL) html += b('Marcar como entregue', S.ENTREGUE, 'secundario');
  if (p.status === S.CORRECAO) html += '<small>Aguardando o solicitante corrigir.</small>';
  if (p.status !== S.CANCELADO && p.status !== S.ENTREGUE) {
    html += '<button class="texto" onclick="mudarStatus(\'' + p.id + '\',\'' + S.CANCELADO + '\')">Cancelar</button>';
  }
  return html;
}

function filtrarAdmin(s) { estado.admin.filtro = s; desenhar(); }

function mudarStatus(id, status, observacao) {
  chamar('adminMudarStatus', { pedidoId: id, status: status, observacao: observacao || '' })
    .then(function () { carregarAdmin().then(function () { avisar('Pedido atualizado.', 'ok'); }); })
    .catch(function (e) { avisar(e.message, 'erro'); });
}

function pedirCorrecao(id) {
  const caixa = document.createElement('div');
  caixa.className = 'cortina';
  caixa.innerHTML = '<div class="modal"><h2>O que precisa ser corrigido?</h2>' +
    '<p class="sub" style="color:var(--texto-fraco);margin-bottom:14px">O solicitante vê esta mensagem e reenvia o pedido.</p>' +
    '<textarea id="motivo" placeholder="Ex.: o comprovante está ilegível, reenvie o print completo."></textarea>' +
    '<div class="acoes fim" style="margin-top:14px">' +
    '<button class="secundario" id="cancelaModal">Voltar</button>' +
    '<button id="confirmaModal">Devolver para correção</button></div></div>';
  document.body.appendChild(caixa);
  caixa.querySelector('#cancelaModal').onclick = function () { caixa.remove(); };
  caixa.querySelector('#confirmaModal').onclick = function () {
    const motivo = caixa.querySelector('#motivo').value.trim();
    if (!motivo) { caixa.querySelector('#motivo').focus(); return; }
    caixa.remove();
    mudarStatus(id, estado.config.status.CORRECAO, motivo);
  };
}

function adminUsuarios() {
  let html = '<div class="cartao"><h2>Usuários cadastrados</h2>' +
    '<p class="sub">Quem não consegue entrar volta para a senha padrão do sistema. Ela aparece nesta tela ' +
    'na hora do reset, e a pessoa é obrigada a criar uma senha nova no próximo acesso.</p>' +
    '<div class="rolagem"><table class="tabela"><thead><tr>' +
    '<th>Nome</th><th>Usuário</th><th>WhatsApp</th><th>Nascimento</th><th>Perfil</th><th>Pedidos</th><th>Ações</th>' +
    '</tr></thead><tbody>';

  estado.admin.usuarios.forEach(function (u) {
    html += '<tr><td>' + escapar(u.nome) + (u.senhaTemporaria ? ' <span class="selo ambar">senha padrão</span>' : '') +
      '</td><td>' + escapar(u.usuario || '—') + '</td><td>' + escapar(u.whatsapp) + '</td>' +
      '<td>' + escapar(u.nascimento) + '</td>' +
      '<td>' + (u.perfil === 'admin' ? 'Administrador' : 'Solicitante') + '</td>' +
      '<td>' + u.pedidos + '</td><td><div class="acoes">' +
      '<button class="secundario pequeno" onclick="resetarSenha(\'' + u.id + '\')">Resetar senha</button>' +
      (u.id === estado.usuario.id ? '' :
        '<button class="texto" onclick="definirPerfil(\'' + u.id + '\',\'' +
        (u.perfil === 'admin' ? 'solicitante' : 'admin') + '\')">' +
        (u.perfil === 'admin' ? 'Remover admin' : 'Tornar admin') + '</button>') +
      '</div></td></tr>';
  });

  html += '</tbody></table></div></div>';
  return html;
}

function resetarSenha(id) {
  if (!confirm('Redefinir a senha deste usuário para a senha padrão?')) return;
  chamar('adminResetarSenha', { usuarioId: id })
    .then(function (r) {
      carregarAdmin().then(function () {
        avisar('Senha de ' + r.nome + ' redefinida para "' + r.senha + '". Avise a pessoa por WhatsApp.', 'ok');
      });
    })
    .catch(function (e) { avisar(e.message, 'erro'); });
}

function definirPerfil(id, perfil) {
  chamar('adminDefinirPerfil', { usuarioId: id, perfil: perfil })
    .then(function () { carregarAdmin().then(function () { avisar('Perfil atualizado.', 'ok'); }); })
    .catch(function (e) { avisar(e.message, 'erro'); });
}

function adminRelatorios() {
  const S = estado.config.status;
  const ordem = [S.AGUARDANDO_COMPROVANTE, S.EM_ANALISE, S.CORRECAO, S.ACEITO, S.DISPONIVEL, S.ENTREGUE, S.CANCELADO];
  const precos = estado.config.precos;

  let html = '<div class="cartao"><h2>Peças por tamanho</h2>' +
    '<p class="sub">Soma de todos os pedidos que não foram cancelados.</p><div class="numeros">';
  Object.keys(precos).forEach(function (k) {
    html += '<div><b>' + (estado.admin.pecas[k] || 0) + '</b><span>' + escapar(precos[k].rotulo) + '</span></div>';
  });
  html += '</div></div>';

  html += '<div class="cartao" style="margin-top:18px"><h2>Baixar inscrições</h2>' +
    '<p class="sub">Gera uma planilha CSV com uma linha por uniforme. Abre direto no Excel e no Google Planilhas.</p>' +
    '<div class="campo"><label for="etapaExport">Etapa</label><select id="etapaExport">' +
    '<option value="TODOS">Todas as etapas</option>';
  ordem.forEach(function (s) { html += '<option value="' + escapar(s) + '">' + escapar(s) + '</option>'; });
  html += '</select></div><div class="acoes">' +
    '<button onclick="baixarCsv(this)">Baixar CSV</button>' +
    '<button class="secundario" onclick="abrirPlanilha(this)">Abrir planilha do banco</button></div></div>';
  return html;
}

function baixarCsv(botao) {
  limparAviso();
  ocupado(botao, true);
  chamar('adminExportar', { status: el('etapaExport').value })
    .then(function (r) {
      const link = document.createElement('a');
      link.href = 'data:text/csv;base64,' + r.conteudo;
      link.download = r.nome;
      document.body.appendChild(link);
      link.click();
      link.remove();
      ocupado(botao, false, 'Baixar CSV');
      avisar(r.linhas + ' linha(s) exportada(s).', 'ok');
    })
    .catch(function (e) { ocupado(botao, false, 'Baixar CSV'); avisar(e.message, 'erro'); });
}

function abrirPlanilha(botao) {
  ocupado(botao, true);
  chamar('adminPlanilha').then(function (r) {
    ocupado(botao, false, 'Abrir planilha do banco');
    window.open(r.url, '_blank');
  }).catch(function (e) { ocupado(botao, false, 'Abrir planilha do banco'); avisar(e.message, 'erro'); });
}
</script>

</body>
